<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hromatite Auth</title>
  <link rel="stylesheet" href="/static/auth.css">
</head>
<body>
  <main class="auth-page">
    <section class="hero-card">
      <div class="brand">
        <span class="brand-mark">H</span>
        <div>
          <strong>Hromatite</strong>
          <small>VPN access portal</small>
        </div>
      </div>
      <h1 id="pageTitle">Вход в аккаунт</h1>
      <p id="pageSubtitle">Авторизуйтесь, чтобы продолжить работу с Hromatite.</p>
      <div class="mode-switch">
        <a id="loginLink" href="/login">Вход</a>
        <a id="registerLink" href="/register">Регистрация</a>
      </div>
    </section>

    <form id="authForm" class="auth-card">
      <label>
        <span>Логин</span>
        <input name="username" autocomplete="username" required minlength="3" maxlength="50">
      </label>
      <label>
        <span>Пароль</span>
        <input name="password" type="password" autocomplete="current-password" required minlength="6">
      </label>
      <button id="submitBtn" type="submit">Войти</button>
      <p id="authMessage"></p>
    </form>
  </main>
  <script src="/static/auth.js"></script>
</body>
</html>
