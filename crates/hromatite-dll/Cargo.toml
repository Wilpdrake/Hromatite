[package]
name = "hromatite-dll"
version = "0.1.0"
edition = "2024"

[lib]
name = "hromatite"
crate-type = ["cdylib"]

[dependencies]
hromatite-core = { path = "../hromatite-core" }
# The anti-cheat hooks must be installed before VRChat registers its
# message-to-server callback, i.e. from the resident's startup thread, not from
# the first managed tick. The crate is pure std + local Win32 declarations.
hromatite-eac = { path = "../hromatite-eac" }

[lints]
workspace = true
