[package]
name = "hromatite-dll"
version = "0.1.0"
edition = "2024"

[lib]
name = "hromatite"
crate-type = ["cdylib"]

# One dependency, on purpose. The resident used to link `hromatite-core`, which
# meant it also compiled the cross-process injector (`manualmap`) and the remote
# reader. Those now live in `hromatite-injector`, and this crate cannot see them.
[dependencies]
hromatite-runtime = { path = "../hromatite-runtime" }

[lints]
workspace = true
