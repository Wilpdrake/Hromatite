[package]
name = "hromatite-nuklear"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Immediate-mode in-game UI (vendored nuklear) for the Hromatite payload"

# The crate is intentionally standalone: it must not depend on `hromatite-core`
# (the resident links both) and it must not depend on the Present hook. The
# only external dependency is the C build tool for the vendored nuklear shim.
[dependencies]

[build-dependencies]
cc = "1"

[lib]
name = "hromatite_nuklear"
path = "src/lib.rs"

[lints]
workspace = true
