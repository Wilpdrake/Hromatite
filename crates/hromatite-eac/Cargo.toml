[package]
name = "hromatite-eac"
version = "0.1.0"
edition = "2024"
description = "EAC/EOS anti-cheat session, heartbeat codec and JSONL event log (pure std)"

[lib]
name = "hromatite_eac"
path = "src/lib.rs"

[features]
# The OS half: the EOSSDK export hooks, the live ELF locator, the memory scan
# and the Photon emitter. Off for `hromatite-features`, which links the pure
# protocol core (`default-features = false`) and must not pull Win32 transitively.
default = ["runtime"]
runtime = ["dep:hromatite-win", "dep:hromatite-hook"]

[dependencies]
# Pure `std` (no FFI, no Win32): the EAC frame checksum is shared with the
# Photon transport, so it lives in the ABI crate.
hromatite-abi = { path = "../hromatite-abi" }
# In-repo only (no external crates): the OS boundary (safe readers, PE/procs)
# and the hook engine. Both belong to the `runtime` feature; the pure core needs
# neither.
hromatite-hook = { path = "../hromatite-hook", optional = true }
hromatite-win = { path = "../hromatite-win", optional = true }

[[test]]
name = "eos_install"
required-features = ["runtime"]

[[test]]
name = "keyhunt_scan"
required-features = ["runtime"]

[lints]
workspace = true
