[package]
name = "hromatite-eac"
version = "0.1.0"
edition = "2024"
description = "EAC/EOS anti-cheat session, heartbeat codec and JSONL event log (pure std)"

[lib]
name = "hromatite_eac"
path = "src/lib.rs"

[dependencies]
# In-repo only (no external crates): the m3 probe reads il2cpp structures
# through the same safe readers the rest of the payload uses.
hromatite-core = { path = "../hromatite-core" }

[lints]
workspace = true
