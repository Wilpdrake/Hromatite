[package]
name = "hromatite-overlay"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "hromatite-overlay"
path = "src/main.rs"

# Standalone: this crate is a *host* (Linux) binary, while the parent workspace
# cross-builds everything for x86_64-pc-windows-gnu.
[workspace]

[profile.release]
opt-level = 2
