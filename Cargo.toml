# Virtual workspace: every buildable unit is a crate under `crates/`.
#
# The root used to be the injector package itself, which is what made
# `Hromatite.exe` link the renderer, il2cpp and the resident runtime. The entry
# points are now separate crates with hard dependency boundaries:
#
#   hromatite-injector   Hromatite.exe       -> hromatite-win only
#   hromatite-dll        hromatite.dll       -> hromatite-runtime only
#   hromatite-runtime    resident library    -> win, hook, render, il2cpp, eac
#   hromatite-features   hromatite_features  -> abi, commands, protocol-only eac
[workspace]
members = [
    "crates/hromatite-abi",
    "crates/hromatite-commands",
    "crates/hromatite-dll",
    "crates/hromatite-eac",
    "crates/hromatite-features",
    "crates/hromatite-hook",
    "crates/hromatite-il2cpp",
    "crates/hromatite-injector",
    "crates/hromatite-render",
    "crates/hromatite-runtime",
    "crates/hromatite-win",
    "crates/test-target",
]
resolver = "3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

[profile.release]
opt-level = 2
# unwind, not abort: a panic in the payload must not take the game down.
# `catch_unwind` in the DLL only works when the whole graph is built with the
# unwinding runtime (a per-package `panic` override is only honoured when that
# package is the build target, which a workspace build is not).
panic = "unwind"
