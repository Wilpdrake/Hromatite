[workspace]
members = [
    "crates/hromatite-abi",
    "crates/hromatite-core",
    "crates/hromatite-dll",
    "crates/hromatite-eac",
    "crates/hromatite-features",
    "crates/test-target",
]
resolver = "3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

[lints]
workspace = true

[package]
name = "Hromatite"
version = "0.1.0"
edition = "2024"

[dependencies]
hromatite-core = { path = "crates/hromatite-core" }

[profile.release]
opt-level = 2
# unwind, not abort: a panic in the payload must not take the game down.
# `catch_unwind` in the DLL only works when the whole graph is built with the
# unwinding runtime (a per-package `panic` override is only honoured when that
# package is the build target, which a workspace build is not).
panic = "unwind"
